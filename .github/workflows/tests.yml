name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is the minimum version the README claims support for.
          # It is not in the ubuntu-latest (24.04) tool cache, so pin to 22.04.
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Aurora itself has zero runtime dependencies; this installs pytest only.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest
