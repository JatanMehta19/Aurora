<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Playground</title>
    <link rel="stylesheet" href="web/style.css">
</head>
<body>
    <header>
        <h1>Aurora Playground</h1>
        <select id="examples"></select>
        <button id="run" disabled>▶ Run</button>
    </header>
    <main>
        <section>
            <h2>Code Editor</h2>
            <div class="editor-wrap">
                <pre id="highlight" aria-hidden="true"></pre>
                <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
            </div>
        </section>
        <section>
            <h2>Output</h2>
            <pre id="output"></pre>
        </section>
    </main>
    <footer id="status">Loading...</footer>
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>
    <script src="web/app.js"></script>
</body>
</html>
